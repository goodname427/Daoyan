name: 缺陷报告
description: 提供可复现步骤、实际结果和预期结果
title: '[缺陷] '
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 浏览器或桌面版、窗口尺寸、版本和操作系统。
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 截图、录像、控制台错误或日志。
